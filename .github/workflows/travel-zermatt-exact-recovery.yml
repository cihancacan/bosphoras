name: Travel Zermatt — recover exact destination photos, no build
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - .github/workflows/travel-zermatt-exact-recovery.yml
      - scripts/recover-zermatt-exact-candidates.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zermatt-exact-source-recovery
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
      - run: python -m py_compile scripts/recover-zermatt-exact-candidates.py
      - run: python -u scripts/recover-zermatt-exact-candidates.py
      - run: |
          python - <<'PY'
          import json
          m=json.load(open('data/travel/zermattMediaCandidates.json'))
          assert len(m['hotels'])==12 and len(m['destinationScenes'])==9
          assert not m['approvedForCommercialPublication'] and not m['visuallyVerified']
          assert all(not x.get('visuallyVerified') or x.get('commercialRightsCleared') for x in m['hotels']+m['destinationScenes'])
          PY
      - name: Keep provenance, images and failure diagnostics in GitHub
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/travel/zermattMediaCandidates.json public/images/travel/zermatt-premium docs/travel-zermatt-exact-photo-recovery.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): publisher-backed Zermatt candidates and diagnostics [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
