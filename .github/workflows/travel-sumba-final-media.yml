name: Travel Sumba — final 21 authentic photos, no Vercel
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: ['scripts/finalize-sumba-media.py','.github/workflows/travel-sumba-final-media.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: travel-sumba-final-21, cancel-in-progress: false}
jobs:
  photographs:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -u scripts/finalize-sumba-media.py
      - name: Commit images and provenance after source identity validation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/travel/sumbaMediaCandidates.json docs/travel-sumba-contact-sheet.jpg docs/travel-sumba-acquisition-report.json public/images/travel/sumba-premium
          git diff --cached --quiet && exit 0
          git commit -m 'assets(travel): 21 distinct Sumba landscapes and hotel photos with source evidence [skip ci]'
          for i in 1 2 3 4 5; do
            git fetch origin feature/luxury-travel-seo-destinations-20261012
            git rebase origin/feature/luxury-travel-seo-destinations-20261012
            if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then exit 0; fi
            sleep 3
          done
          exit 1
