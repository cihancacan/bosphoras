name: Travel Monaco - editorial and TypeScript QA without Vercel build
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - .github/workflows/travel-monaco-qa.yml
      - scripts/check-monaco-draft.mjs
      - data/travel/monacoGuide.ts
      - data/travel/monacoDraftGuide.ts
      - data/travel/monacoDraftFaq.ts
      - data/travel/monacoMediaCandidates.json
      - data/travel/monacoPremiumEditorial.ts
      - data/travel/featuredCityGuides.ts
      - components/travel/FeaturedCityGuide.tsx
      - components/travel/TravelPages.tsx
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript compile without Vercel build
        run: npm run typecheck
      - name: Monaco editorial, indexation and provenance checks
        run: node scripts/check-monaco-draft.mjs
      - name: Confirm original catalogue and noindex
        run: node scripts/check-travel-catalogue.mjs
      - name: Save successful Monaco CI verification in GitHub (no Vercel build)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('data/travel/monacoMediaCandidates.json')
          m=json.loads(p.read_text(encoding='utf8'))
          shots=m['hotels']+m['destinationScenes']
          assert len(shots)==21 and all(x.get('visuallyVerified') and x.get('commercialRightsCleared') for x in shots)
          report={
            'destination':'monaco',
            'status':'INTERNAL_QA_PASSED',
            'branch':'feature/luxury-travel-seo-destinations-20261012',
            'qaCommit':os.environ.get('GITHUB_SHA',''),
            'hotelPhotosApproved':12,
            'localScenesApproved':9,
            'totalApproved':21,
            'frFaqCount':7,'enFaqCount':7,
            'verifiedBy':['npm run typecheck','node scripts/check-monaco-draft.mjs','node scripts/check-travel-catalogue.mjs'],
            'indexing':'noindex',
            'productionDeployed':False,
            'vercelBuildRequested':False
          }
          Path('docs/travel-monaco-qa-result.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          print('All Monaco checks passed; reporting internal branch QA only.')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/travel-monaco-qa-result.json
          if ! git diff --cached --quiet; then
            git commit -m 'test(travel): Monaco 21/21 visual and TypeScript QA confirmed [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
# Final Monaco release candidate: 21 manually reviewed real-source images; noindex retained.
