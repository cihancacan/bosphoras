name: Bosphoras Rajasthan 78 - prepare 21 local WebP assets
on:
  push:
    branches:
      - feature/luxury-travel-seo-destinations-20261012
    paths:
      - .github/workflows/travel-rajasthan-webp.yml
      - scripts/generate-rajasthan-preview-webp.py
      - data/travel/rajasthanMediaSources.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rajasthan-78-webp-on-feature
  cancel-in-progress: false
jobs:
  generate-private-preview-webps:
    if: github.ref == 'refs/heads/feature/luxury-travel-seo-destinations-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install photo tools
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'requests>=2.31,<3'
      - name: Fetch exact 21 known property/landscape pictures, hash, optimize and reject duplicates
        run: python -u scripts/generate-rajasthan-preview-webp.py
      - name: Verify no broken photos and private rights gate
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          from PIL import Image
          m=json.load(open('data/travel/rajasthanMediaCandidates.json'))
          assert m['cityCount']==9 and m['hotelCount']==12 and not m['publicUseApproved']
          all_photos=m['destinationScenes']+m['hotels']
          assert len(all_photos)==21
          assert len({i['webpSHA256'] for i in all_photos})==21
          for p in all_photos:
              loc=pathlib.Path('public'+p['localPath'])
              assert loc.exists(),p['key']
              assert hashlib.sha256(loc.read_bytes()).hexdigest()==p['webpSHA256']
              with Image.open(loc) as im:
                  assert im.format=='WEBP' and im.width<=1280 and im.height<=850
          assert all(x['commercialRightsCleared'] for x in m['destinationScenes'])
          assert sum(bool(x['commercialRightsCleared']) for x in m['hotels'])==3
          print('RAJASTHAN_21_REAL_WEBP_PRIVATE_QA_SUCCESS')
          PY
      - name: Commit reviewed-source local WebPs and manifest to existing feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/images/travel/rajasthan-premium/ data/travel/rajasthanMediaCandidates.json data/travel/rajasthanWebpOptimization.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(travel): Rajasthan 78 21 real source-checked WebP photos for protected Preview [skip ci]"
            for attempt in 1 2 3 4; do
              git fetch origin feature/luxury-travel-seo-destinations-20261012
              git rebase origin/feature/luxury-travel-seo-destinations-20261012
              if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then
                echo "RAJASTHAN_21_WEBP_COMMIT_PUSHED"
                exit 0
              fi
              sleep 3
            done
            echo "Could not push Rajasthan assets after retries" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rajasthan-78-webp-audit
          path: data/travel/rajasthanWebpOptimization.json
          if-no-files-found: ignore

