name: Travel Saint-Tropez — inspect four luxury hotel photo galleries
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/audit-saint-tropez-hotel-images.py
      - .github/workflows/travel-saint-tropez-hotel-audit.yml
permissions:
  contents: write
jobs:
  hotel-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - run: python scripts/audit-saint-tropez-hotel-images.py
      - name: Commit source-audit only
        if: always()
        run: |
          set -euo pipefail
          if [ -f data/travel/saintTropezHotelPhotoCandidates.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/travel/saintTropezHotelPhotoCandidates.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(travel): record authentic Saint-Tropez property photo candidates [skip ci]"
              git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
              git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
            fi
          fi
