name: Travel Phuket — audit official four-resort photography
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: [scripts/audit-phuket-official-hotel-images.py, .github/workflows/travel-phuket-hotel-photo-audit.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - run: python scripts/audit-phuket-official-hotel-images.py
      - name: Commit source ledger on feature only
        if: always()
        run: |
          set -euo pipefail
          if [ -f data/travel/phuketOfficialHotelPhotoCandidates.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/travel/phuketOfficialHotelPhotoCandidates.json
            if ! git diff --cached --quiet; then
              git commit -m 'chore(travel): record official Phuket hotel photo candidates [skip ci]'
              git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
              git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
            fi
          fi
