name: Travel luxury — two official region photography candidates
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - 'scripts/final-place-exact-official-photo.py'
      - '.github/workflows/travel-final-place-official.yml'
permissions:
  contents: write
jobs:
  exact-regional-places:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/final-place-exact-official-photo.py
      - run: python -u scripts/final-place-exact-official-photo.py
      - name: Commit true geographically matched candidate assets only
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for d in val-disere verbier; do
            [ ! -d "public/images/travel/$d-premium" ] || git add "public/images/travel/$d-premium"
          done
          git add data/travel/valDisereMediaCandidates.json data/travel/verbierMediaCandidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): regional tourism sourced exact Val Laisinant and Verbier Creux photo candidates [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
