name: Travel luxury — two remaining exact hotel gallery candidates
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - 'scripts/two-exact-luxury-hotel-photos.py'
      - '.github/workflows/travel-two-remaining-hotel-photos.yml'
permissions:
  contents: write
jobs:
  two-images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
      - run: python -m py_compile scripts/two-exact-luxury-hotel-photos.py
      - run: python -u scripts/two-exact-luxury-hotel-photos.py
      - name: Save original exact hotel photo candidates without build
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/travel/jacksonHoleMediaCandidates.json data/travel/bigSkyMediaCandidates.json
          [ ! -d public/images/travel/jackson-hole-premium ] || git add public/images/travel/jackson-hole-premium
          [ ! -d public/images/travel/big-sky-premium ] || git add public/images/travel/big-sky-premium
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): final two original hotel gallery photos sourced [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
