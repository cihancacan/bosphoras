name: Travel Monaco — collect 21 authentic image candidates (no Vercel build)
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/collect-monaco-media.py
      - .github/workflows/travel-monaco-media.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: travel-monaco-images
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install source and image tools
        run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - name: Syntax guard
        run: python -m py_compile scripts/collect-monaco-media.py
      - name: Collect hotel and geographic source candidates
        run: python -u scripts/collect-monaco-media.py
      - name: Check no automatic publication
        run: |
          python - <<'PY'
          import json
          m=json.load(open('data/travel/monacoMediaCandidates.json', encoding='utf8'))
          assert m['destination']=='monaco'
          assert len(m['hotels'])==12 and len(m['destinationScenes'])==9
          assert not m['visuallyVerified'] and not m['approvedForCommercialPublication']
          assert all(not x.get('visuallyVerified') or (x.get('commercialRightsCleared') and not x.get('visualQaWarning')) for x in m['hotels']+m['destinationScenes'])
          print('No unpublished or unapproved Monaco image is declared usable.')
          PY
      - name: Save WebP candidates on existing feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/images/travel/monaco-premium data/travel/monacoMediaCandidates.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): genuine Monaco hotel and destination image candidates, pending QA [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
