name: Bodrum Luxury — download reviewed hospitality images
on:
  push:
    branches:
      - feature/luxury-travel-seo-destinations-20261012
    paths:
      - .github/workflows/travel-bodrum-premium-images.yml
      - scripts/download-bodrum-premium-photos.py
permissions:
  contents: write
concurrency:
  group: bodrum-reviewed-photos
  cancel-in-progress: false
jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'Pillow>=10,<12'
      - run: python scripts/download-bodrum-premium-photos.py
      - name: Commit verified files with provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/travel/bodrumPremiumImageSources.json
          if [ -d public/images/travel/bodrum-premium ]; then git add public/images/travel/bodrum-premium; fi
          if ! git diff --cached --quiet; then
            git commit -m "assets(travel): local premium Bodrum hotel images with provenance [skip ci]"
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
      - name: Save photo audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bodrum-curated-image-audit
          path: data/travel/bodrumPremiumImageSources.json
          if-no-files-found: ignore
