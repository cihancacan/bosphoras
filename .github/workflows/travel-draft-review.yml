name: Archive unpublished travel drafts and audit structure
on:
  push:
    branches: [feature/travel-six-language-drafts]
    paths: ['.github/workflows/travel-draft-review.yml','scripts/review-travel-drafts.py']
permissions:
  contents: write
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/travel-six-language-drafts}
      - uses: actions/download-artifact@v4
        with:
          name: travel-source
          path: /tmp/source
          run-id: 45913565425
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: unpublished-*-drafts
          path: /tmp/drafts
          merge-multiple: true
          run-id: 45913565425
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: unpublished-zh-recovery
          path: /tmp/drafts
          run-id: 45914382814
          github-token: ${{ github.token }}
      - run: python3 scripts/review-travel-drafts.py /tmp/source/travel-source.json /tmp/drafts
      - name: Save only on editorial draft branch
        run: |
          set -euo pipefail
          mkdir -p editorial-drafts/travel
          cp /tmp/drafts/{de,tr,es,it,pt,zh}-drafts.json editorial-drafts/travel/
          cp /tmp/drafts/review-report.json editorial-drafts/travel/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editorial-drafts/travel
          if ! git diff --cached --quiet; then
            git commit -m 'Archive unpublished travel drafts and structural review'
            git push origin HEAD:refs/heads/feature/travel-six-language-drafts
          fi
