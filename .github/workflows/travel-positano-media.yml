name: Travel Positano - authentic photo candidates (GitHub only)
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/collect-positano-media.py
      - .github/workflows/travel-positano-media.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: travel-positano-photos
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/collect-positano-media.py
      - run: python -u scripts/collect-positano-media.py
      - name: Assert no automatic photograph publication
        run: |
          python - <<'PY'
          import json
          m=json.load(open('data/travel/positanoMediaCandidates.json'))
          assert len(m['hotels'])==12 and len(m['destinationScenes'])==9
          assert not m['visuallyVerified'] and not m['approvedForCommercialPublication']
          assert not any(x['visuallyVerified'] or x['commercialRightsCleared'] for x in m['hotels']+m['destinationScenes'])
          print('Positano candidate collection remains unpublished')
          PY
      - name: Commit image candidates with no Vercel build
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- public/images/travel/positano-premium data/travel/positanoMediaCandidates.json docs/travel-positano-download-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): Positano photo candidates awaiting independent QA [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
