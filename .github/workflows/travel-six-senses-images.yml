name: Bodrum Six Senses — import selected hotel photography
on:
  push:
    branches:
      - feature/luxury-travel-seo-destinations-20261012
    paths:
      - .github/workflows/travel-six-senses-images.yml
      - scripts/download-six-senses-bodrum-photos.py
permissions:
  contents: write
concurrency:
  group: travel-six-senses-bodrum-photos
  cancel-in-progress: false
jobs:
  import-selected-photographs:
    if: github.ref == 'refs/heads/feature/luxury-travel-seo-destinations-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'requests>=2.31,<3'
      - name: Download two sourced hotel photos
        run: python scripts/download-six-senses-bodrum-photos.py
      - name: Record downloads in travel feature branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/travel/sixSensesPhotoSources.json
          if [ -d public/images/travel/bodrum-premium/six-senses-kaplankaya ]; then
            git add public/images/travel/bodrum-premium/six-senses-kaplankaya
          fi
          if ! git diff --cached --quiet; then
            git commit -m "assets(travel): add two Six Senses Kaplankaya property photos [skip ci]"
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
      - name: Preserve audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-six-senses-photo-audit
          path: data/travel/sixSensesPhotoSources.json
          if-no-files-found: ignore
