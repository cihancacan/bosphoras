name: Localized travel editorial quality
on:
  push:
    branches: [feature/travel-guides-ru-ar]
    paths: ['.github/workflows/travel-localization-quality.yml','scripts/check-edited-travel-localizations.cjs','scripts/check-travel-localized-*.cjs','data/travel/localized/**','data/travel/localizedGuides.ts','components/travel/LocalizedFeaturedCityGuide.tsx','components/travel/TravelPages.tsx','data/travel/guideIndexation.ts','components/Investment*.tsx','components/InternationalInvestmentPage.tsx','lib/investmentPortalI18n.ts','data/investmentVentureTranslations.ts','app/ru/investment/**','app/ar/investment/**','scripts/check-investment-localizations.cjs','data/propertyDesk.ts','components/Property*.tsx','components/GlobalPropertyInvestmentPage.tsx','components/ProjectWishlist.tsx','scripts/check-property-localizations.cjs','data/pages/**','app/sitemap.ts','app/[locale]/[...slug]/page.tsx','scripts/check-service-localizations.cjs']
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node -r ./scripts/register-ts.cjs scripts/check-edited-travel-localizations.cjs
      - run: node -r ./scripts/register-ts.cjs scripts/check-travel-localized-seo.cjs
      - run: node -r ./scripts/register-ts.cjs scripts/check-travel-localized-render.cjs
      - run: node -r ./scripts/register-ts.cjs scripts/check-investment-localizations.cjs
      - run: node -r ./scripts/register-ts.cjs scripts/check-property-localizations.cjs
      - run: node -r ./scripts/register-ts.cjs scripts/check-service-localizations.cjs
      - run: npm run typecheck
