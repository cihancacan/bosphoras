name: Localized travel editorial quality
on:
  push:
    branches: [feature/travel-guides-ru-ar]
    paths: ['.github/workflows/travel-localization-quality.yml','scripts/check-edited-travel-localizations.cjs','scripts/check-travel-localized-*.cjs','data/travel/localized/**','data/travel/localizedGuides.ts','components/travel/LocalizedFeaturedCityGuide.tsx','components/travel/TravelPages.tsx','data/travel/guideIndexation.ts']
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node -r ./scripts/register-ts.cjs scripts/check-edited-travel-localizations.cjs
      - run: node -r ./scripts/register-ts.cjs scripts/check-travel-localized-seo.cjs
      - run: node -r ./scripts/register-ts.cjs scripts/check-travel-localized-render.cjs
      - run: npm run typecheck
