name: Travel Saint-Tropez — licensed harbour and Pampelonne photography
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/download-saint-tropez-destination-photos.py
      - .github/workflows/travel-saint-tropez-destination-images.yml
permissions:
  contents: write
concurrency:
  group: travel-saint-tropez-destination-media
  cancel-in-progress: false
jobs:
  import-destination-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'Pillow>=10,<12'
      - name: Download documented and geolocated Saint-Tropez CC source photos
        run: python scripts/download-saint-tropez-destination-photos.py
      - name: Commit WebP and attribution report to Travel branch only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f data/travel/saintTropezDestinationImageSources.json ]; then git add data/travel/saintTropezDestinationImageSources.json; fi
          if [ -d public/images/travel/saint-tropez-premium/destination ]; then git add public/images/travel/saint-tropez-premium/destination; fi
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): import CC BY Saint-Tropez harbour and Pampelonne WebP [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saint-tropez-destination-sources
          path: data/travel/saintTropezDestinationImageSources.json
          if-no-files-found: ignore
