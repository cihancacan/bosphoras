name: Zermatt — official Mont Cervin PDF photo provenance
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/research-zermatt-mont-pdf.py
      - .github/workflows/travel-zermatt-mont-pdf.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hotel_pdf_photos:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'PyMuPDF>=1.24,<2' 'requests>=2.31,<3' 'Pillow>=10,<12'
      - run: python -m py_compile scripts/research-zermatt-mont-pdf.py
      - run: python -u scripts/research-zermatt-mont-pdf.py
      - run: python -m py_compile scripts/research-zermatt-omnia-pdf.py
      - run: python -u scripts/research-zermatt-omnia-pdf.py
      - name: Save photo candidates without indexing or Vercel builds
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- public/images/travel/zermatt-premium/mont-cervin-research docs/travel-zermatt-mont-cervin-pdf-media.json public/images/travel/zermatt-premium/the-omnia-research docs/travel-zermatt-omnia-official-pdf-media.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): official Mont Cervin Palace brochure images for manual QA [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
