name: Wink staging — private safe connection smoke test
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: [scripts/check-wink-staging-preview.py, .github/workflows/wink-staging-connection-check.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wink-safe-connectivity-check
  cancel-in-progress: false
jobs:
  staging-auth-and-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: POST diagnostic endpoint without secrets; redact all account and hotel information
        run: python scripts/check-wink-staging-preview.py
      - name: Keep only sanitized HTTP and gRPC status report on feature branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f data/travel/winkStagingConnectionCheck.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/travel/winkStagingConnectionCheck.json
            if ! git diff --cached --quiet; then
              git commit -m 'test(wink): record staging API connectivity status (redacted) [skip ci]'
              git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
              git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
            fi
          fi
