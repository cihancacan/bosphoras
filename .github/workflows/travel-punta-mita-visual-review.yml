name: Travel Punta Mita - inspect 21 images contact sheet
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: [.github/workflows/travel-punta-mita-visual-review.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Emit transient reduced contact-sheet preview without uploading hotel photos
        run: |
          python - <<'PY'
          import base64,io
          from PIL import Image
          im=Image.open('docs/travel-punta-mita-contact-sheet.jpg').convert('RGB')
          im.thumbnail((1160,1450),Image.Resampling.LANCZOS)
          out=io.BytesIO()
          im.save(out,format='JPEG',quality=58,optimize=True)
          print('PUNTA_MITA_SHEET_START')
          print(base64.b64encode(out.getvalue()).decode())
          print('PUNTA_MITA_SHEET_END')
          print('Dimensions:',im.size,'Bytes:',len(out.getvalue()))
          PY
