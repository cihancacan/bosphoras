name: Travel Canouan — 21 sourced luxury photographs (GitHub only)
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/collect-canouan-media.py
      - .github/workflows/travel-canouan-media.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: travel-canouan-photos
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - name: Collect 12 property and 9 Canouan landscape WebP photo candidates
        run: python -u scripts/collect-canouan-media.py
      - name: Keep 88 destinations unchanged
        run: node scripts/check-travel-catalogue.mjs
      - name: Commit non-indexed image candidates without Vercel Preview
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- public/images/travel/canouan-premium data/travel/canouanMediaCandidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): 21 Canouan genuine photo candidates [skip ci]'
            for i in 1 2 3 4 5; do
              git fetch origin feature/luxury-travel-seo-destinations-20261012
              git rebase origin/feature/luxury-travel-seo-destinations-20261012
              if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then exit 0; fi
              sleep 2
            done
            exit 1
          fi

# Launch the reviewed Canouan 12-property plus 9-island-photo source collector (October 27, 2026).
