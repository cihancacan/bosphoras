name: Travel luxury — licensed hotel images from precise approved sources
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - 'scripts/finish-exact-hotels-from-source-urls.py'
      - '.github/workflows/travel-exact-hotel-source-images.yml'
permissions:
  contents: write
concurrency:
  group: travel-hotel-exact-sources
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
      - run: python -m py_compile scripts/finish-exact-hotels-from-source-urls.py
      - run: python -u scripts/finish-exact-hotels-from-source-urls.py
      - name: Save sourced WebP candidates, not a Vercel deployment
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for city in megeve jackson-hole big-sky; do
            [ ! -d "public/images/travel/$city-premium" ] || git add "public/images/travel/$city-premium"
          done
          git add data/travel/megeveMediaCandidates.json data/travel/jacksonHoleMediaCandidates.json data/travel/bigSkyMediaCandidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): correct hotel-only licensed photo sources for Megeve Jackson Moonlight [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
