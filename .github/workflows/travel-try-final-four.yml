name: Travel 10 — inspect final four missing exact images
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - 'scripts/try-final-four-travel-sources.py'
      - '.github/workflows/travel-try-final-four.yml'
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/try-final-four-travel-sources.py
      - run: python -u scripts/try-final-four-travel-sources.py
      - name: Save exact property/place images with no Vercel Preview
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for loc in jackson-hole big-sky val-disere verbier; do
            [ ! -d "public/images/travel/$loc-premium" ] || git add "public/images/travel/$loc-premium"
          done
          git add data/travel/jacksonHoleMediaCandidates.json data/travel/bigSkyMediaCandidates.json data/travel/valDisereMediaCandidates.json data/travel/verbierMediaCandidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): source-checked final named hotel and place candidates [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
