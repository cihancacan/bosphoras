name: Travel Pamalican Island Amanpulo — 21 original images
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/collect-pamalican-island-media.py
      - .github/workflows/travel-pamalican-island-media.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: travel-pamalican-island-media
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - name: Collect original Amanpulo photos
        run: python -u scripts/collect-pamalican-island-media.py
      - name: Preserve 88 destinations
        run: node scripts/check-travel-catalogue.mjs
      - name: Commit 21 genuine WebP files on feature branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- public/images/travel/pamalican-island-premium data/travel/pamalicanIslandMediaCandidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): 21 Amanpulo photo candidates [skip ci]'
            for i in 1 2 3 4 5; do
              git fetch origin feature/luxury-travel-seo-destinations-20261012
              git rebase origin/feature/luxury-travel-seo-destinations-20261012
              if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then exit 0; fi
              sleep 2
            done
            exit 1
          fi

# Trigger importer after successful local validation: 21 distinct official Aman WebP photographs.
