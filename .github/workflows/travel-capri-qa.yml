name: Travel Capri - bilingual editorial and TypeScript QA only
on:
  push:
    branches:
      - feature/luxury-travel-seo-destinations-20261012
    paths:
      - data/travel/capri*
      - data/travel/featuredCityGuides.ts
      - components/travel/TravelPages.tsx
      - components/travel/FeaturedCityGuide.tsx
      - scripts/check-capri-draft.mjs
      - .github/workflows/travel-capri-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: node scripts/check-capri-draft.mjs
      - run: node scripts/check-travel-catalogue.mjs
