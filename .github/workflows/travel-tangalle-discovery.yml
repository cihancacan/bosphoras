name: Tangalle 80 source photo discovery (no deployments)
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - .github/workflows/travel-tangalle-discovery.yml
      - scripts/discover-tangalle-photo-candidates.py
permissions: { contents: read }
jobs:
  inspect-hotel-official-gallery-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python -u scripts/discover-tangalle-photo-candidates.py
