name: Bosphoras correction — exact place landscape replacements
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - 'scripts/replace-targeted-landscapes.py'
      - '.github/workflows/travel-correct-reported-landscapes.yml'
permissions:
  contents: write
concurrency:
  group: travel-correct-reported-landscapes
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
      - run: python -m py_compile scripts/replace-targeted-landscapes.py
      - run: python -u scripts/replace-targeted-landscapes.py
      - name: Commit source-attributed geographic replacements, not Vercel
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for slug in st-moritz megeve jackson-hole big-sky; do
            [ ! -d "public/images/travel/$slug-premium/destination" ] || git add "public/images/travel/$slug-premium/destination"
          done
          for stem in stMoritz megeve jacksonHole bigSky; do
            git add "data/travel/${stem}MediaCandidates.json"
          done
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): replace poor scenery with exact-location Commons photographs [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
