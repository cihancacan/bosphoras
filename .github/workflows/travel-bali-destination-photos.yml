name: Travel Bali — six licensed authentic destination photographs
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: [scripts/download-bali-destination-photos.py, .github/workflows/travel-bali-destination-photos.yml]
permissions:
  contents: write
concurrency:
  group: travel-bali-destination-media
  cancel-in-progress: false
jobs:
  destinations:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'Pillow>=10,<12'
      - run: python scripts/download-bali-destination-photos.py
      - name: Commit geolocated Bali WebP and provenance ledger
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f data/travel/baliDestinationImageSources.json ]; then git add data/travel/baliDestinationImageSources.json; fi
          if [ -d public/images/travel/bali-premium/destination ]; then git add public/images/travel/bali-premium/destination; fi
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): store Bali authentic CC geographic images [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bali-geographic-image-provenance
          path: data/travel/baliDestinationImageSources.json
          if-no-files-found: ignore
