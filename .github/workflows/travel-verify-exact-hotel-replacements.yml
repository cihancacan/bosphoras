name: Travel editorial — replace Ritz Setsu Wort with true property photographs
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - 'scripts/complete-niseko-and-wort-photo-slots.py'
      - '.github/workflows/travel-verify-exact-hotel-replacements.yml'
permissions:
  contents: write
concurrency:
  group: travel-exact-hotel-replacement
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
      - run: python -m py_compile scripts/complete-niseko-and-wort-photo-slots.py
      - run: python -u scripts/complete-niseko-and-wort-photo-slots.py
      - name: Commit accurately sourced hotel candidates to branch (not Preview)
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/travel/niseko-premium public/images/travel/jackson-hole-premium
          git add data/travel/nisekoMediaCandidates.json data/travel/jacksonHoleMediaCandidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): hotel-specific suite and fireplace photo candidates [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
