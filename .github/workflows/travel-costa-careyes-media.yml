name: Travel Costa Careyes - source-labelled media collection
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: [scripts/collect-costa-careyes-media.py, .github/workflows/travel-costa-careyes-media.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: travel-costa-careyes-source-media
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - name: Collect Careyes property and landscape images with photographer rights hold
        run: python -u scripts/collect-costa-careyes-media.py
      - run: node scripts/check-travel-catalogue.mjs
      - name: Commit local original WebPs and visual contact sheet
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/images/travel/costa-careyes-premium data/travel/costaCareyesMediaCandidates.json docs/travel-costa-careyes-contact-sheet.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): import Careyes named products and nine distinct coast images [skip ci]'
            for i in 1 2 3 4 5; do
              git fetch origin feature/luxury-travel-seo-destinations-20261012
              git rebase origin/feature/luxury-travel-seo-destinations-20261012
              if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
