name: Travel authentic hotel photo final three
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - 'scripts/add-hotel-rooms-after-qc.py'
      - '.github/workflows/travel-final-hotel-room-photos.yml'
permissions:
  contents: write
concurrency:
  group: travel-authentic-hotel-room-three
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
      - run: python -m py_compile scripts/add-hotel-rooms-after-qc.py
      - run: python -u scripts/add-hotel-rooms-after-qc.py
      - name: Commit photo candidates without deploying to Vercel
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/travel/niseko-premium public/images/travel/aspen-premium public/images/travel/jackson-hole-premium
          git add data/travel/nisekoMediaCandidates.json data/travel/aspenMediaCandidates.json data/travel/jacksonHoleMediaCandidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): genuine Setsu Jerome Jackson hotel room sources awaiting final review [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
