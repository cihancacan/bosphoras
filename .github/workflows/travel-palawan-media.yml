name: Travel Palawan — 21 provenance-checked private preview photos
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: ['scripts/collect-palawan-media.py','.github/workflows/travel-palawan-media.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: travel-palawan-media, cancel-in-progress: false}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/collect-palawan-media.py
      - run: python -u scripts/collect-palawan-media.py
      - name: Commit only source images, manifest, and contact sheet (not production)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/images/travel/palawan-premium data/travel/palawanMediaCandidates.json docs/travel-palawan-contact-sheet.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'assets(travel): Palawan 21 official and Commons WebPs with source evidence [skip ci]'
          for i in 1 2 3 4 5; do
            git fetch origin feature/luxury-travel-seo-destinations-20261012
            git rebase origin/feature/luxury-travel-seo-destinations-20261012
            if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then exit 0; fi
            sleep 2
          done
          exit 1
