name: Travel LAUCALA Island - 21 official-source photo candidates
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/collect-laucala-island-media.py
      - .github/workflows/travel-laucala-island-media.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: travel-laucala-island-photos
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - name: Capture authentic publisher images, leaving all exact-villa identities unclaimed
        run: python -u scripts/collect-laucala-island-media.py
      - name: Preserve original 88 destination slugs
        run: node scripts/check-travel-catalogue.mjs
      - name: Save 21 unique local WebP files without Vercel build
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- public/images/travel/laucala-island-premium data/travel/laucalaIslandMediaCandidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): 21 LAUCALA resort-source WebP candidates [skip ci]'
            for i in 1 2 3 4 5; do
              git fetch origin feature/luxury-travel-seo-destinations-20261012
              git rebase origin/feature/luxury-travel-seo-destinations-20261012
              if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then exit 0; fi
              sleep 2
            done
            exit 1
          fi

# Run verified LAUCALA 21-file source collector (dry run complete on 27 October 2026).
