name: Travel editorial drafts - six additional languages
on:
  push:
    branches: [feature/travel-six-language-drafts]
    paths: ['.github/workflows/travel-six-language-drafts.yml','scripts/translate-travel-guides.py']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node -r ./scripts/register-ts.cjs scripts/export-travel-localization.cjs /tmp/travel-source.json
      - uses: actions/upload-artifact@v4
        with: {name: travel-source, path: /tmp/travel-source.json, retention-days: 7}
  drafts:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - {locale: de, model: Helsinki-NLP/opus-mt-en-de}
          - {locale: es, model: Helsinki-NLP/opus-mt-en-es}
          - {locale: it, model: Helsinki-NLP/opus-mt-en-it}
          - {locale: tr, model: Helsinki-NLP/opus-mt-tc-big-en-tr}
          - {locale: pt, model: Helsinki-NLP/opus-mt-tc-big-en-pt}
          - {locale: zh, model: Helsinki-NLP/opus-mt-en-zh}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with: {name: travel-source, path: /tmp/translation}
      - name: Install local translation engine
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet 'transformers>=4.48,<5' 'ctranslate2>=4.5,<5' sentencepiece sacremoses
          ct2-transformers-converter --model ${{ matrix.model }} --output_dir /tmp/ct2-model --quantization int8
      - name: Generate unpublished editorial drafts
        run: python -u scripts/translate-travel-guides.py --locale ${{ matrix.locale }} --model-id ${{ matrix.model }} --include-desaru --source /tmp/translation/travel-source.json --model-dir /tmp/ct2-model --output /tmp/out/${{ matrix.locale }}-drafts.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unpublished-${{ matrix.locale }}-drafts
          path: /tmp/out/${{ matrix.locale }}-drafts.json
          if-no-files-found: warn
          retention-days: 7
