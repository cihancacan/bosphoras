name: Travel alpine — finish missing candidate images and build review boards
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/complete-and-review-alpine-media.py
      - scripts/render-alpine-photo-review.py
      - .github/workflows/travel-alpine-review-boards.yml
permissions:
  contents: write
concurrency:
  group: travel-alpine-final-photo-review
  cancel-in-progress: false
jobs:
  photo-review:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
      - run: python -m py_compile scripts/complete-and-review-alpine-media.py scripts/render-alpine-photo-review.py
      - run: python -u scripts/complete-and-review-alpine-media.py
      - run: python scripts/render-alpine-photo-review.py
      - name: Save complete photo candidates and browser-readable review sheets
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for slug in st-moritz aspen niseko; do
            [ ! -d "public/images/travel/$slug-premium" ] || git add "public/images/travel/$slug-premium"
          done
          git add data/travel/stMoritzMediaCandidates.json data/travel/aspenMediaCandidates.json data/travel/nisekoMediaCandidates.json || true
          [ ! -f docs/travel-alpine-photo-review-index.md ] || git add docs/travel-alpine-photo-review-*.md
          if ! git diff --cached --quiet; then
            git commit -m 'quality(travel): complete alpine photo references and publish source-linked internal review boards [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
