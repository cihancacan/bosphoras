name: Travel 89–99 — verify direct Nuitée hotel links
on:
  push:
    branches: [feature/travel-destinations-89-93-drafts]
    paths:
      - .github/workflows/travel-89-93-nuitee.yml
      - scripts/nuitee-map-hotels.cjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: travel-89-93-nuitee
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/travel-destinations-89-93-drafts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Verify supplier identities; no booking, payment or customer data
        env:
          NUITEE_API_KEY: ${{ secrets.NUITEE_API_KEY }}
        run: |
          set -euo pipefail
          SCOPE=london,las-vegas,rome,barcelona,cancun,orlando,hong-kong,kuala-lumpur,osaka,seoul,madrid
          node -r ./scripts/register-ts.cjs scripts/nuitee-map-hotels.cjs --destinations="$SCOPE"
          if [ -z "${NUITEE_API_KEY:-}" ]; then
            echo "::error::Nuitée API key not configured in repository Actions; no hotel IDs assigned."
            exit 2
          fi
          node -r ./scripts/register-ts.cjs scripts/nuitee-map-hotels.cjs --destinations="$SCOPE" --lookup --apply
      - name: Persist exact supplier matches with address and source evidence
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/travel/nuiteeMappings.json docs/travel-nuitee-89-93-coverage.json docs/travel-nuitee-89-93-unmapped.csv
          if ! git diff --cached --quiet; then
            git commit -m 'travel: verified Nuitée hotel identities for 89–99 [skip ci]'
            git pull --rebase origin feature/travel-destinations-89-93-drafts
            git push origin HEAD:feature/travel-destinations-89-93-drafts
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: travel-89-99-nuitee-coverage
          path: |
            docs/travel-nuitee-89-93-coverage.json
            docs/travel-nuitee-89-93-unmapped.csv
          if-no-files-found: ignore
