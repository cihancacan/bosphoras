name: Travel third Alpine — authentic photo candidates
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/download-third-alpine-media.py
      - .github/workflows/travel-third-alpine-media.yml
permissions:
  contents: write
concurrency:
  group: travel-third-alpine-media
  cancel-in-progress: false
jobs:
  import-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/download-third-alpine-media.py
      - run: python -u scripts/download-third-alpine-media.py
      - name: Save candidate WebP and sources without Vercel build
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for slug in megeve gstaad zermatt; do
            [ ! -d "public/images/travel/$slug-premium" ] || git add "public/images/travel/$slug-premium"
            [ ! -f "data/travel/$slug"MediaCandidates.json ] || git add "data/travel/$slug"MediaCandidates.json
          done
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): collect next three genuine Alpine image candidates pending QA [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
