name: Travel Bali — inspect official hotel photography
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/audit-bali-hotel-images.py
      - .github/workflows/travel-bali-hotel-audit.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - run: python scripts/audit-bali-hotel-images.py
      - name: Save source candidate ledger on feature branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f data/travel/baliHotelPhotoCandidates.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/travel/baliHotelPhotoCandidates.json
            if ! git diff --cached --quiet; then
              git commit -m 'chore(travel): document Bali official resort photo candidates [skip ci]'
              git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
              git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
            fi
          fi
