name: Travel Zermatt — collect precise hotel and local photos
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - .github/workflows/travel-zermatt-media.yml
      - scripts/collect-zermatt-media.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zermatt-collect-20261019
  cancel-in-progress: false
jobs:
  source_images:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/collect-zermatt-media.py
      - name: Download only exact hotel/city image candidates
        run: python -u scripts/collect-zermatt-media.py
      - name: Validate fail-closed manifest
        run: |
          python - <<'PY'
          import json
          m=json.load(open('data/travel/zermattMediaCandidates.json'))
          assert len(m['hotels'])==12 and len(m['destinationScenes'])==9
          assert m['destination']=='zermatt'
          assert not m['approvedForCommercialPublication']
          for x in m['hotels']+m['destinationScenes']:
              if x.get('visuallyVerified'):
                  assert x.get('commercialRightsCleared') and not x.get('visualQaWarning')
          print('Zermatt image provenance manifest intact; all new files remain unapproved.')
          PY
      - name: Save candidate assets (do not deploy Vercel)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- public/images/travel/zermatt-premium data/travel/zermattMediaCandidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): Zermatt authentic candidates awaiting visual QA [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
