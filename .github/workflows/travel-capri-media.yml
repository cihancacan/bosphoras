name: Travel Capri - collect sourced photo candidates (GitHub only)
on:
  push:
    branches:
      - feature/luxury-travel-seo-destinations-20261012
    paths:
      - scripts/collect-capri-media.py
      - .github/workflows/travel-capri-media.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: travel-capri-photo-source
  cancel-in-progress: false
jobs:
  source_photos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/collect-capri-media.py
      - name: Download genuine candidate originals without granting photo approval
        run: python -u scripts/collect-capri-media.py
      - name: Check no publication or automatic photo approval
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/travel/capriMediaCandidates.json',encoding='utf8'))
          assert len(d['hotels'])==12 and len(d['destinationScenes'])==9
          assert not d['visuallyVerified'] and not d['approvedForCommercialPublication']
          for x in d['hotels']+d['destinationScenes']:
              assert not x['visuallyVerified'] and not x['commercialRightsCleared']
          print('Capri candidates remain QA-gated and unpublishable.')
          PY
      - name: Persist sourced WebP candidates in GitHub without Vercel build
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- public/images/travel/capri-premium data/travel/capriMediaCandidates.json docs/travel-capri-download-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): Capri attributed photo candidates for independent visual QA [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
