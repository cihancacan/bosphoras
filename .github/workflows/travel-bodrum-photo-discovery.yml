name: Bodrum Luxury — official image discovery
on:
  push:
    branches:
      - feature/luxury-travel-seo-destinations-20261012
    paths:
      - .github/workflows/travel-bodrum-photo-discovery.yml
      - scripts/discover-bodrum-official-photos.py
permissions:
  contents: write
concurrency:
  group: bodrum-official-photos
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - run: python scripts/discover-bodrum-official-photos.py
      - name: Record research for human review (no page change)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/travel/bodrumHotelPhotoCandidates.json
          if ! git diff --cached --quiet; then
            git commit -m "research(travel): record Bodrum official photo candidates [skip ci]"
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
