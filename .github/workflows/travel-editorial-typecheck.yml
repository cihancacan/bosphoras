name: Travel editorial typecheck (GitHub only, not Vercel)
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - 'data/travel/**.ts'
      - 'components/travel/**.tsx'
      - 'scripts/check-travel-catalogue.mjs'
      - 'scripts/check-next-alpine-drafts.mjs'
      - 'scripts/check-third-alpine-drafts.mjs'
      - 'scripts/check-mountain-ten-batch-drafts.mjs'
      - 'scripts/check-travel-batch-preview.mjs'
      - 'data/travel/*MediaCandidates.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: travel-typecheck-feature
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: 'npm'}
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: node scripts/check-travel-catalogue.mjs
      - run: node scripts/check-turks-and-caicos-draft.mjs
      - run: node scripts/check-turks-and-caicos-final.mjs
      - run: node scripts/check-canouan-final.mjs
      - run: node scripts/check-necker-island-final.mjs
      - run: node scripts/check-north-island-seychelles-final.mjs
      - run: node scripts/check-pamalican-island-final.mjs
      - run: node scripts/check-laucala-island-final.mjs
      - run: node scripts/check-jumby-bay-final.mjs
      - run: node scripts/check-okavango-delta-final.mjs
      - run: node scripts/check-punta-mita-final.mjs
      - run: node scripts/check-costa-careyes-final.mjs
      - run: node scripts/check-istanbul-destination-final.mjs
      - run: node scripts/check-new-york-destination-final.mjs
      - run: node scripts/check-miami-destination-final.mjs
      - run: node scripts/check-los-angeles-destination-final.mjs
      - run: node scripts/check-mayakoba-destination-final.mjs
      - run: node -r ./scripts/register-ts.cjs scripts/check-san-miguel-de-allende-final.cjs
      - run: node -r ./scripts/register-ts.cjs scripts/check-krabi-draft.cjs
      - run: node -r ./scripts/register-ts.cjs scripts/check-koh-yao-noi-final.cjs
      - run: node -r ./scripts/register-ts.cjs scripts/check-bangkok-final.cjs
      - run: node -r ./scripts/register-ts.cjs scripts/check-chiang-mai-final.cjs
      - run: node scripts/check-next-alpine-drafts.mjs
      - run: node scripts/check-third-alpine-drafts.mjs
      - run: node scripts/check-mountain-ten-batch-drafts.mjs
      - run: node scripts/check-travel-batch-preview.mjs
