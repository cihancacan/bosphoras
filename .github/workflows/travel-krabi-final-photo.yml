name: Krabi — finish last CC landscape (no Vercel)
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - '.github/workflows/travel-krabi-final-photo.yml'
      - 'scripts/finalize-krabi-klong-photo.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: travel-krabi-final-image
  cancel-in-progress: false
jobs:
  approve-one-source-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -u scripts/finalize-krabi-klong-photo.py
      - name: Commit ONLY improved scene and its truthful license metadata
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/images/travel/krabi-premium/destination/scene-4.webp data/travel/krabiMediaCandidates.json docs/travel-krabi-acquisition-report.json
          git diff --cached --quiet && exit 0
          git commit -m 'assets(travel): complete 21 Krabi authentic photos with licensed Koh Kwang palm landscape [skip ci]'
          for i in 1 2 3 4 5; do
            git fetch origin feature/luxury-travel-seo-destinations-20261012
            git rebase origin/feature/luxury-travel-seo-destinations-20261012
            if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then exit 0; fi
            sleep 2
          done
          exit 1
