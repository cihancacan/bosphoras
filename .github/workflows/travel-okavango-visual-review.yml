name: Travel Okavango Delta - transient visual contact sheet inspection
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: [.github/workflows/travel-okavango-visual-review.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Emit short-lived lower-resolution contact sheet for visual QA
        run: |
          python - <<'PY'
          from PIL import Image
          from io import BytesIO
          import base64
          im=Image.open('docs/travel-okavango-delta-contact-sheet.jpg').convert('RGB')
          im.thumbnail((1160,1440),Image.Resampling.LANCZOS)
          b=BytesIO()
          im.save(b,format='JPEG',quality=57,optimize=True)
          print('OKAVANGO_VISUAL_CONTACT_SHEET_START')
          print(base64.b64encode(b.getvalue()).decode('ascii'))
          print('OKAVANGO_VISUAL_CONTACT_SHEET_END')
          print('Dimensions:',im.size, 'JPEG bytes:',len(b.getvalue()))
          PY
