name: Bangkok complete 21 source photos (no Vercel)
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: ['scripts/finalize-bangkok-photo-sources.py','.github/workflows/travel-bangkok-finish-media.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: travel-bangkok-finish-source-images
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -u scripts/finalize-bangkok-photo-sources.py
      - run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/travel/bangkokMediaCandidates.json docs/travel-bangkok-acquisition-report.json docs/travel-bangkok-contact-sheet.jpg public/images/travel/bangkok-premium/destination/scene-5.webp public/images/travel/bangkok-premium/mandarin-oriental
          git diff --cached --quiet && exit 0
          git commit -m 'assets(travel): 21 authentic Bangkok photographs incl. three licensed Mandarin hotel archive views [skip ci]'
          for i in 1 2 3 4 5; do
            git fetch origin feature/luxury-travel-seo-destinations-20261012
            git rebase origin/feature/luxury-travel-seo-destinations-20261012
            if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then exit 0; fi
            sleep 2
          done
          exit 1
