name: Travel Courchevel 1850 — authentic property and resort images
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: [scripts/download-courchevel-1850-images.py, .github/workflows/travel-courchevel-1850-images.yml]
permissions:
  contents: write
concurrency:
  group: travel-courchevel-1850-images
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/download-courchevel-1850-images.py
      - name: Download real property-specific photographs
        run: python scripts/download-courchevel-1850-images.py
      - name: Commit media and manifests only on feature branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          [ ! -d public/images/travel/courchevel-1850-premium ] || git add public/images/travel/courchevel-1850-premium
          git add data/travel/courchevel1850PremiumImageSources.json data/travel/courchevel1850DestinationImageSources.json data/travel/courchevel1850Guide.ts
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): Courchevel property and resort WebP images [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: courchevel-image-provenance
          path: |
            data/travel/courchevel1850PremiumImageSources.json
            data/travel/courchevel1850DestinationImageSources.json
          if-no-files-found: ignore
