name: Travel Istanbul — localize editorial photos
# Retry sourcing from reviewed CNTraveler hotel photo galleries (October 2026).

on:
  push:
    branches:
      - feature/luxury-travel-seo-destinations-20261012
    paths:
      - .github/workflows/travel-istanbul-images.yml

permissions:
  contents: write

concurrency:
  group: travel-istanbul-image-import
  cancel-in-progress: false

jobs:
  import-images:
    if: github.ref == 'refs/heads/feature/luxury-travel-seo-destinations-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Travel branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'requests>=2.31,<3'
      - name: Download, validate, optimize and record provenance
        run: python scripts/localize-travel-images.py
      - name: Commit successful local photo assets to Travel branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/travel/hotelPhotography.ts data/travel/downloadReport.json public/images/travel/istanbul/
          if git diff --cached --quiet; then
            echo "No new photo assets to commit"
            exit 0
          fi
          git commit -m "chore(travel): store verified Istanbul hotel photography locally [skip ci]"
          git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
      - name: Save photo sourcing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-istanbul-photo-sourcing
          path: data/travel/downloadReport.json
          if-no-files-found: ignore
