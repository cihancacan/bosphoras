name: Travel North Island Seychelles — original 21 photo candidates
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/collect-north-island-seychelles-media.py
      - .github/workflows/travel-north-island-seychelles-media.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: travel-north-island-seychelles-images
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
      - name: Collect original North Island accommodation and conservation photographs
        run: python -u scripts/collect-north-island-seychelles-media.py
      - name: Preserve original travel catalogue
        run: node scripts/check-travel-catalogue.mjs
      - name: Commit media and manifest to branch only without preview build
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- public/images/travel/north-island-seychelles-premium data/travel/northIslandSeychellesMediaCandidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): 21 North Island genuine resort photo candidates [skip ci]'
            for i in 1 2 3 4 5; do
              git fetch origin feature/luxury-travel-seo-destinations-20261012
              git rebase origin/feature/luxury-travel-seo-destinations-20261012
              if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then exit 0; fi
              sleep 2
            done
            exit 1
          fi

# Start verified official North Island image download after isolated collector dry-run (21/21 unique files).
