name: Travel Sumba — licensed landscapes and property candidate photos
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: ['scripts/collect-sumba-media.py','.github/workflows/travel-sumba-media.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: travel-sumba-media, cancel-in-progress: false}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/collect-sumba-media.py
      - run: python -u scripts/collect-sumba-media.py
      - name: Persist source manifests and candidate WebPs — no Vercel deployment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/travel/sumbaMediaCandidates.json docs/travel-sumba-acquisition-report.json docs/travel-sumba-contact-sheet.jpg
          if [ -d public/images/travel/sumba-premium ]; then git add -A -- public/images/travel/sumba-premium; fi
          git diff --cached --quiet && exit 0
          git commit -m 'assets(travel): Sumba source candidates with licensing and contact sheet [skip ci]'
          for i in 1 2 3 4 5; do
            git fetch origin feature/luxury-travel-seo-destinations-20261012
            git rebase origin/feature/luxury-travel-seo-destinations-20261012
            if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then exit 0; fi
            sleep 2
          done
          exit 1
