name: Travel Cap Ferrat — authentic hotel and peninsula images
# Re-run after explicit isolation of Monaco direct-source tables and quality review.
on:
  push:
    branches:
      - feature/luxury-travel-seo-destinations-20261012
    paths:
      - .github/workflows/travel-cap-ferrat-media.yml
      - scripts/collect-saint-jean-cap-ferrat-media.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bosphoras-cap-ferrat-images
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media utilities
        run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - name: Verify photo acquisition code
        run: |
          python -m py_compile scripts/collect-monaco-media.py
          python -m py_compile scripts/collect-saint-jean-cap-ferrat-media.py
      - name: Get exact hotel and location media candidates
        run: python -u scripts/collect-saint-jean-cap-ferrat-media.py
      - name: Assert manual visual approval remains mandatory
        run: |
          python - <<'PY'
          import json
          m=json.load(open('data/travel/saintJeanCapFerratMediaCandidates.json',encoding='utf8'))
          assert m['destination']=='saint-jean-cap-ferrat'
          assert len(m['hotels'])==12 and len(m['destinationScenes'])==9
          assert not m['visuallyVerified'] and not m['approvedForCommercialPublication']
          for x in m['hotels']+m['destinationScenes']:
            if x.get('visuallyVerified'):
              assert x.get('commercialRightsCleared') and not x.get('visualQaWarning')
          print('No uninspected Cap Ferrat images released.')
          PY
      - name: Audit downloaded candidates without approving them
        run: |
          python - <<'PY'
          import json,re
          m=json.load(open('data/travel/saintJeanCapFerratMediaCandidates.json',encoding='utf8'))
          candidates=[x for x in m['hotels']+m['destinationScenes'] if x.get('localPath')]
          for x in candidates:
              assert x['status']=='candidate_needs_visual_review',(x.get('propertyKey'),x['key'])
              assert (x.get('sourcePage') or '').startswith('https://'),x['key']
              assert (x.get('downloadUrl') or '').startswith('https://'),x['key']
              assert re.fullmatch('[a-f0-9]{64}',x.get('sha256','')),x['key']
              assert re.fullmatch('[01]{64}',x.get('dhash','')),x['key']
              assert x.get('credit'),x['key']
          print('Provenance-valid Cap-Ferrat candidates:',len(candidates),'/21; manual review mandatory.')
          PY
      - name: Commit retrieved WebP candidates only, no Vercel build
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/travel/saintJeanCapFerratMediaCandidates.json
          if [ -d public/images/travel/saint-jean-cap-ferrat-premium ]; then git add -A -- public/images/travel/saint-jean-cap-ferrat-premium; fi
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): source-backed Saint-Jean-Cap-Ferrat candidate photos for QA [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
