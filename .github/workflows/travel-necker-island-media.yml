name: Travel Necker Island — 21 original-photo candidates (no Vercel build)
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/collect-necker-island-media.py
      - .github/workflows/travel-necker-island-media.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: travel-necker-island-photos
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - name: Save 12 Virgin property photos and 9 Necker island scenes
        run: python -u scripts/collect-necker-island-media.py
      - name: Preserve all 88 destinations
        run: node scripts/check-travel-catalogue.mjs
      - name: Commit physical media files to feature branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- public/images/travel/necker-island-premium data/travel/neckerIslandMediaCandidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): 21 Necker Island original-photo candidates [skip ci]'
            for i in 1 2 3 4 5; do
              git fetch origin feature/luxury-travel-seo-destinations-20261012
              git rebase origin/feature/luxury-travel-seo-destinations-20261012
              if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then exit 0; fi
              sleep 2
            done
            exit 1
          fi

# Run the source-only Necker Island collector after original-image resolution has been verified.
