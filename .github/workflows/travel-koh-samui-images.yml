name: Travel Koh Samui — exact-property hotels and real island photos
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: [scripts/download-koh-samui-images.py, .github/workflows/travel-koh-samui-images.yml]
permissions:
  contents: write
concurrency:
  group: travel-koh-samui-image-import
  cancel-in-progress: false
jobs:
  photo_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - name: Import attributable Koh Samui imagery
        run: python scripts/download-koh-samui-images.py
      - name: Commit audited WebP and rights ledger to feature branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d public/images/travel/koh-samui-premium ]; then git add public/images/travel/koh-samui-premium; fi
          for f in data/travel/kohSamuiPremiumImageSources.json data/travel/kohSamuiDestinationImageSources.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): audit Koh Samui photographs and sources [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koh-samui-media-rights-ledger
          path: |
            data/travel/kohSamuiPremiumImageSources.json
            data/travel/kohSamuiDestinationImageSources.json
          if-no-files-found: ignore
