name: Travel 10 — exact location photo sources from Wikimedia
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - 'scripts/complete-exact-travel-geography.py'
      - '.github/workflows/travel-exact-geography-photos.yml'
permissions:
  contents: write
concurrency:
  group: travel-precise-geography
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
      - run: python -m py_compile scripts/complete-exact-travel-geography.py
      - run: python -u scripts/complete-exact-travel-geography.py
      - name: Save true landscape sources without preview
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for slug in megeve jackson-hole val-disere; do
            [ ! -d "public/images/travel/$slug-premium" ] || git add "public/images/travel/$slug-premium"
          done
          for stem in megeve jacksonHole valDisere; do
            git add "data/travel/${stem}MediaCandidates.json"
          done
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): exact geographic Commons sources with licensed photographer metadata [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
