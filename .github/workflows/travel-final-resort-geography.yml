name: Travel luxury — precision scenery photographs for five mountain destinations
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - 'scripts/final-resort-geography-sources.py'
      - '.github/workflows/travel-final-resort-geography.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
      - run: python -m py_compile scripts/final-resort-geography-sources.py
      - run: python -u scripts/final-resort-geography-sources.py
      - name: Commit locally-grounded candidate images without Vercel deployment
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for d in jackson-hole big-sky val-disere verbier; do
            [ ! -d "public/images/travel/$d-premium" ] || git add "public/images/travel/$d-premium"
          done
          git add data/travel/jacksonHoleMediaCandidates.json data/travel/bigSkyMediaCandidates.json data/travel/valDisereMediaCandidates.json data/travel/verbierMediaCandidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): genuine named winter resort photos from traceable publishers [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
