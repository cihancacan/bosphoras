name: Travel Punta Mita - 21 genuine photo sources
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: [scripts/collect-punta-mita-media.py, .github/workflows/travel-punta-mita-media.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: punta-mita-21-assets
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - name: Download and verify 12 authentic hotel and 9 geographic candidate photos
        run: python -u scripts/collect-punta-mita-media.py
      - run: node scripts/check-travel-catalogue.mjs
      - name: Commit WebPs, provenance and contact sheet to feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- public/images/travel/punta-mita-premium data/travel/puntaMitaMediaCandidates.json docs/travel-punta-mita-contact-sheet.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): Punta Mita 12 hotel and 9 Commons candidate photos [skip ci]'
            for i in 1 2 3 4 5; do
              git fetch origin feature/luxury-travel-seo-destinations-20261012
              git rebase origin/feature/luxury-travel-seo-destinations-20261012
              if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
