name: Travel mountain — source-specific photo completion
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/refine-mountain-press-and-commons.py
      - .github/workflows/travel-refine-mountain-candidates.yml
permissions:
  contents: write
concurrency:
  group: travel-mountain-press-source
  cancel-in-progress: false
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/refine-mountain-press-and-commons.py
      - run: python -u scripts/refine-mountain-press-and-commons.py
      - run: python scripts/render-mountain-photo-review.py
      - name: Commit property matching and Commons photo source reviews without Vercel builds
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for slug in megeve jackson-hole big-sky; do
            [ ! -d "public/images/travel/$slug-premium" ] || git add "public/images/travel/$slug-premium"
          done
          for manifest in megeve jacksonHole bigSky; do
            [ ! -f "data/travel/${manifest}MediaCandidates.json" ] || git add "data/travel/${manifest}MediaCandidates.json"
          done
          [ ! -f docs/travel-mountain-photo-review-index.md ] || git add docs/travel-mountain-photo-review-*.md
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): source-specific Four Seasons One&Only and Commons photo candidates [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
