name: Travel Deià — authentic 21 WebPs to GitHub only
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/collect-deia-media.py
      - .github/workflows/travel-deia-media.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: travel-deia-photo-collection
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
      - name: Fetch real official-hotel and Commons photos
        run: python -u scripts/collect-deia-media.py
      - name: Require 21 different image files and 88 untouched destinations
        run: |
          node scripts/check-deia-draft.mjs
          node scripts/check-travel-catalogue.mjs
      - name: Store in GitHub without deploying on Vercel
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- public/images/travel/deia-premium data/travel/deiaMediaCandidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): Deià 21 provenance-checked WebP photos [skip ci]'
            for i in 1 2 3 4 5; do
              git fetch origin feature/luxury-travel-seo-destinations-20261012
              git rebase origin/feature/luxury-travel-seo-destinations-20261012
              if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then exit 0; fi
              sleep 2
            done
            exit 1
          fi

# Run once to collect signed Deià images, no Preview release.
