name: Travel next alpine — source-specific photo corrections
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: [scripts/refine-next-alpine-media.py, .github/workflows/travel-refine-alpine-media.yml]
permissions:
  contents: write
concurrency:
  group: travel-refine-alpine-media
  cancel-in-progress: false
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/refine-next-alpine-media.py
      - run: python -u scripts/refine-next-alpine-media.py
      - name: Commit corrected unpublished photo candidates
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for slug in st-moritz aspen niseko; do
            [ ! -d "public/images/travel/$slug-premium" ] || git add "public/images/travel/$slug-premium"
          done
          git add data/travel/stMoritzMediaCandidates.json data/travel/aspenMediaCandidates.json data/travel/nisekoMediaCandidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): correct alpine candidate photo identities and sources [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
