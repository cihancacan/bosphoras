name: Travel Miami — authentic landscapes and hotel-publisher media
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: [scripts/collect-miami-media.py, .github/workflows/travel-miami-media.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: travel-miami-media
  cancel-in-progress: false
jobs:
  import-miami-images:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - name: Acquire Miami photos and trace individual licence sources
        run: python -u scripts/collect-miami-media.py
      - name: Preserve all 88 existing destination slugs
        run: node scripts/check-travel-catalogue.mjs
      - name: Commit local WebP and photo provenance without triggering Vercel build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- public/images/travel/miami-premium data/travel/miamiMediaCandidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): genuine Miami local photos and rights manifest [skip ci]'
            for i in 1 2 3 4 5; do
              git fetch origin feature/luxury-travel-seo-destinations-20261012
              git rebase origin/feature/luxury-travel-seo-destinations-20261012
              if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
      - name: Save Miami visual provenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-miami-media-manifest
          path: data/travel/miamiMediaCandidates.json
          if-no-files-found: ignore
