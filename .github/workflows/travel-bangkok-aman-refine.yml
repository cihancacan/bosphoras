name: Bangkok Aman visual refinement (no Vercel)
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: ['scripts/replace-bangkok-aman-duplicate.py','.github/workflows/travel-bangkok-aman-refine.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -u scripts/replace-bangkok-aman-duplicate.py
      - run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/travel/bangkokMediaCandidates.json public/images/travel/bangkok-premium/aman-nai-lert/view-2.webp
          git diff --cached --quiet && exit 0
          git commit -m 'assets(travel): distinct Aman Nai Lert wellness photo, no duplicates [skip ci]'
          for i in 1 2 3 4 5; do
            git fetch origin feature/luxury-travel-seo-destinations-20261012
            git rebase origin/feature/luxury-travel-seo-destinations-20261012
            if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then exit 0; fi
            sleep 2
          done
          exit 1
