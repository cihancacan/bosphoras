name: Travel Ravello — collect candidate originals (GitHub only)
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/collect-ravello-media.py
      - .github/workflows/travel-ravello-media.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: travel-ravello-photos
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/collect-ravello-media.py
      - run: python -u scripts/collect-ravello-media.py
      - name: Confirm no false photo approval or publication
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/travel/ravelloMediaCandidates.json',encoding='utf8'))
          assert len(d['hotels'])==12 and len(d['destinationScenes'])==9
          assert not d['visuallyVerified'] and not d['approvedForCommercialPublication']
          assert not any(x['visuallyVerified'] or x['commercialRightsCleared'] for x in d['hotels']+d['destinationScenes'])
          print('All Ravello image candidates remain blocked.')
          PY
      - name: Commit candidates to GitHub only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- public/images/travel/ravello-premium data/travel/ravelloMediaCandidates.json docs/travel-ravello-download-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): Ravello source-linked image candidates [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
