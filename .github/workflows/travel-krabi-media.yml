name: Travel Krabi — source photos (private QA, no Vercel)
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - 'scripts/collect-krabi-media.py'
      - '.github/workflows/travel-krabi-media.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: travel-krabi-source-review
  cancel-in-progress: false
jobs:
  acquire-source-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/collect-krabi-media.py
      - run: python -u scripts/collect-krabi-media.py
      - name: Commit sourced candidate files, licence metadata and contact sheet; NEVER approve or deploy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/travel/krabiMediaCandidates.json docs/travel-krabi-acquisition-report.json docs/travel-krabi-contact-sheet.jpg
          if [ -d public/images/travel/krabi-premium ]; then
            git add -A -- public/images/travel/krabi-premium
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): Krabi candidate photo provenance, no public rights approval [skip ci]'
            for attempt in 1 2 3 4 5; do
              git fetch origin feature/luxury-travel-seo-destinations-20261012
              git rebase origin/feature/luxury-travel-seo-destinations-20261012
              if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
