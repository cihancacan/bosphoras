name: Travel mountain — Megève Jackson Hole Big Sky image provenance
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/collect-western-mountain-photos.py
      - scripts/repair-megeve-photos.py
      - scripts/render-mountain-photo-review.py
      - .github/workflows/travel-mountain-photo-provenance.yml
permissions:
  contents: write
concurrency:
  group: travel-mountain-photo-qa
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/collect-western-mountain-photos.py scripts/repair-megeve-photos.py scripts/render-mountain-photo-review.py
      - run: python -u scripts/collect-western-mountain-photos.py
      - run: python -u scripts/repair-megeve-photos.py
      - run: python scripts/render-mountain-photo-review.py
      - name: Save verified sources, candidate photos, gallery review with no Vercel build
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for slug in megeve jackson-hole big-sky; do
            [ ! -d "public/images/travel/$slug-premium" ] || git add "public/images/travel/$slug-premium"
          done
          for manifest in megeve jacksonHole bigSky; do
            if [ -f "data/travel/${manifest}MediaCandidates.json" ]; then
              git add "data/travel/${manifest}MediaCandidates.json"
            fi
          done
          [ ! -f docs/travel-mountain-photo-review-index.md ] || git add docs/travel-mountain-photo-review-*.md
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): genuine Megève Jackson Big Sky photo candidates for review [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
