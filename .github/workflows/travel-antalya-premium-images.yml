name: Travel Antalya — import curated premium hotel imagery
on:
  push:
    branches:
      - feature/luxury-travel-seo-destinations-20261012
    paths:
      - .github/workflows/travel-antalya-premium-images.yml
      - scripts/download-antalya-premium-photos.py
permissions:
  contents: write
concurrency:
  group: travel-antalya-premium-images
  cancel-in-progress: false
jobs:
  import-antalya-editorial-photographs:
    if: github.ref == 'refs/heads/feature/luxury-travel-seo-destinations-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'requests>=2.31,<3'
      - name: Download, check and convert hotel photography
        id: photos
        run: python scripts/download-antalya-premium-photos.py
      - name: Persist verified local image files and source audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/travel/antalyaPremiumImageSources.json
          if [ -d public/images/travel/antalya-premium ]; then
            git add public/images/travel/antalya-premium
          fi
          if ! git diff --cached --quiet; then
            git commit -m "assets(travel): commit checked Antalya hotel photos and source audit [skip ci]"
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
      - name: Upload download report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antalya-photo-source-audit
          path: data/travel/antalyaPremiumImageSources.json
          if-no-files-found: ignore
