name: Travel Bali — curated four-resort photography
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: [scripts/download-bali-premium-hotel-photos.py, .github/workflows/travel-bali-premium-images.yml]
permissions:
  contents: write
concurrency:
  group: travel-bali-curated-hotel-media
  cancel-in-progress: false
jobs:
  import-hotel-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'Pillow>=10,<12'
      - run: python scripts/download-bali-premium-hotel-photos.py
      - name: Record property images and provenance on feature only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f data/travel/baliPremiumImageSources.json ]; then git add data/travel/baliPremiumImageSources.json; fi
          if [ -d public/images/travel/bali-premium ]; then git add public/images/travel/bali-premium; fi
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): import individually credited Bali resort photos [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bali-hotel-photo-provenance
          path: data/travel/baliPremiumImageSources.json
          if-no-files-found: ignore
