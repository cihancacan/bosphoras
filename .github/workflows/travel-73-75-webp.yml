name: Bosphoras #73-75 — three destinations actual WebP photos
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - .github/workflows/travel-73-75-webp.yml
      - scripts/generate-phuquoc-singapore-sentosa-webp.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: travel-webp-73-75-assets
  cancel-in-progress: false
jobs:
  save-optimized-destination-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - slug: phu-quoc
            stem: phuQuoc
          - slug: sentosa
            stem: sentosa
          - slug: singapore
            stem: singapore
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image conversion dependencies
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'requests>=2.31,<3'
      - name: Verify all 21 original photo hashes and generate WebP
        run: python -u scripts/generate-phuquoc-singapore-sentosa-webp.py --destination "${{ matrix.slug }}"
      - name: Confirm all 21 images are actual WebP and rights remain blocked
        env:
          DEST: ${{ matrix.slug }}
          STEM: ${{ matrix.stem }}
        run: |
          python - <<'PY'
          import os,json,pathlib,hashlib
          from PIL import Image
          a=json.load(open(f"data/travel/{os.environ['STEM']}WebpOptimization.json"))
          m=json.load(open(f"data/travel/{os.environ['STEM']}MediaCandidates.json"))
          assert len(a['photos'])==21 and a['totalPhotos']==21
          assert not a['publicUseApproved'] and not m['publicUseApproved']
          for p in a['photos']:
            path=pathlib.Path('public'+p['localPath'])
            assert hashlib.sha256(path.read_bytes()).hexdigest()==p['webpSha256']
            with Image.open(path) as im:assert im.format=="WEBP" and im.width<=1280 and im.height<=850
          print('DEST_21_WEBP_QA_PASS',os.environ['DEST'])
          PY
      - name: Commit optimized WebP to EXISTING feature branch without Vercel build
        env:
          DEST: ${{ matrix.slug }}
          STEM: ${{ matrix.stem }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "public/images/travel/${DEST}-premium" "data/travel/${STEM}WebpOptimization.json"
          if ! git diff --cached --quiet; then
            git commit -m "assets(travel): verified local WebP ${DEST} image pack [skip ci]"
            for attempt in 1 2 3 4 5; do
              git fetch origin feature/luxury-travel-seo-destinations-20261012
              git rebase origin/feature/luxury-travel-seo-destinations-20261012
              if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then
                echo "WEBP_IMPORTED ${DEST}"
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "${{ matrix.slug }}-webp-audit"
          path: "data/travel/${{ matrix.stem }}WebpOptimization.json"
          if-no-files-found: ignore
