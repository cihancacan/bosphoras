name: Travel Turks and Caicos — image collector (GitHub only)
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/collect-turks-and-caicos-media.py
      - .github/workflows/travel-turks-and-caicos-media.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: travel-turks-and-caicos-image-collection
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - name: Collect hotel and Commons photographs into non-published candidate manifest
        run: python -u scripts/collect-turks-and-caicos-media.py
      - name: Preserve the original 88 and check source-reviewed editorial
        run: |
          node scripts/check-turks-and-caicos-draft.mjs
          node scripts/check-travel-catalogue.mjs
      - name: Commit only media candidates back to feature branch (no Vercel Preview)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+cihancacan@users.noreply.github.com'
          git add -A -- public/images/travel/turks-and-caicos-premium data/travel/turksAndCaicosMediaCandidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): Turks and Caicos original photo candidates [skip ci]'
            for i in 1 2 3 4 5; do
              git fetch origin feature/luxury-travel-seo-destinations-20261012
              git rebase origin/feature/luxury-travel-seo-destinations-20261012
              if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then exit 0; fi
              sleep 2
            done
            exit 1
          fi

# Photo collector run trigger after official and partner sources checked on 27 Oct 2026.
