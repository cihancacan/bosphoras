name: Travel New York — genuine city and hotel photography sourcing
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: [scripts/collect-new-york-media.py, .github/workflows/travel-new-york-media.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: travel-new-york-media
  cancel-in-progress: false
jobs:
  new-york-images:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - name: Import genuine Manhattan city scenes and hotel media
        run: python -u scripts/collect-new-york-media.py
      - name: Preserve existing 88 destinations
        run: node scripts/check-travel-catalogue.mjs
      - name: Commit provenance manifest and local WebPs — NO Vercel build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- public/images/travel/new-york-premium data/travel/newYorkMediaCandidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): New York source-audited local WebPs, rights pending [skip ci]'
            for i in 1 2 3 4 5; do
              git fetch origin feature/luxury-travel-seo-destinations-20261012
              git rebase origin/feature/luxury-travel-seo-destinations-20261012
              if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
      - name: Save photo manifest even if incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-new-york-media-report
          path: data/travel/newYorkMediaCandidates.json
          if-no-files-found: ignore

# Run source-media workflow once; intentionally no [travel-batch-ready] Vercel marker.
