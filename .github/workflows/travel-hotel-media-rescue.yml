name: Travel 10 — exact hotel media completion, one Preview only after QA
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - 'scripts/finish-four-seasons-oneonly-media.py'
      - '.github/workflows/travel-hotel-media-rescue.yml'
permissions:
  contents: write
concurrency:
  group: travel-premium-hotel-media-rescue
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/finish-four-seasons-oneonly-media.py
      - run: python -u scripts/finish-four-seasons-oneonly-media.py
      - name: Write authentic candidates to GitHub branch only
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for slug in megeve jackson-hole big-sky; do
            [ ! -d "public/images/travel/$slug-premium" ] || git add "public/images/travel/$slug-premium"
          done
          for key in megeve jacksonHole bigSky; do
            git add "data/travel/${key}MediaCandidates.json"
          done
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): exact Four Seasons and OneOnly photo source candidates [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
