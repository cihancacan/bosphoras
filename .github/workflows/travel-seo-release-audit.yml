name: Travel SEO release audit
on:
  push:
    branches: [feature/travel-seo-release-audit]
    paths: ['.github/workflows/travel-seo-release-audit.yml','scripts/submit-travel-indexnow.mjs']
permissions:
  contents: read
jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/submit-travel-indexnow.mjs
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: paris-guide, path: /en/travel/destinations/paris}
          - {name: istanbul-hotels, path: /travel/hotels/istanbul}
          - {name: dubai-guide, path: /ar/travel/destinations/dubai}
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Lighthouse mobile lab audit
        run: |
          mkdir -p reports
          npx --yes lighthouse@12 "https://www.bosphoras.com${{ matrix.path }}" --output=json --output-path="reports/${{ matrix.name }}.json" --chrome-flags="--headless --no-sandbox" --only-categories=performance,seo,accessibility --quiet
          node -e 'const r=require("./reports/${{ matrix.name }}.json"); if(r.runtimeError)throw Error(r.runtimeError.message); console.log(JSON.stringify({url:r.finalDisplayedUrl,performance:r.categories.performance.score,seo:r.categories.seo.score,accessibility:r.categories.accessibility.score,LCP:r.audits["largest-contentful-paint"].displayValue,CLS:r.audits["cumulative-layout-shift"].displayValue,TBT:r.audits["total-blocking-time"].displayValue},null,2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-${{ matrix.name }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7
