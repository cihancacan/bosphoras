name: Travel image corrections — true photo provenance before publishing
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/recover-rejected-travel-images.py
      - .github/workflows/travel-recover-rejected-images.yml
permissions:
  contents: write
concurrency:
  group: travel-accurate-replacements-20261019
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/recover-rejected-travel-images.py
      - run: python -u scripts/recover-rejected-travel-images.py
      - name: Commit only factual candidate replacements; Vercel build ignored
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for slug in st-moritz val-disere big-sky verbier; do
            git add -A -- "public/images/travel/${slug}-premium" || true
          done
          git add data/travel/stMoritzMediaCandidates.json data/travel/valDisereMediaCandidates.json data/travel/bigSkyMediaCandidates.json data/travel/verbierMediaCandidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): exact rejected image replacements awaiting visual approval [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
