name: Bosphoras Jaipur 77 - 21 verified private-preview WebP candidates
on:
  push:
    branches:
      - feature/luxury-travel-seo-destinations-20261012
    paths:
      - .github/workflows/travel-jaipur-webp.yml
      - scripts/generate-jaipur-preview-webp.py
      - data/travel/jaipurMediaSources.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jaipur-77-webp-feature
  cancel-in-progress: false
jobs:
  build-jaipur-reviewed-source-candidates:
    if: github.ref == 'refs/heads/feature/luxury-travel-seo-destinations-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install photo tools
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'requests>=2.31,<3'
      - name: Convert 21 named original sources to local optimized WebP, capture metadata and hashes
        run: python -u scripts/generate-jaipur-preview-webp.py
      - name: Verify all 21 source distinct images and owner-preview rights
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          from PIL import Image
          m=json.load(open('data/travel/jaipurMediaCandidates.json'))
          assert m['destinationNumber']==77 and m['cityCount']==9 and m['hotelCount']==12 and not m['publicUseApproved']
          images=m['destinationScenes']+m['hotels']
          assert len(images)==21 and len({p['webpSHA256'] for p in images})==21
          assert all(p['commercialRightsCleared'] for p in m['destinationScenes'])
          assert all(not p['previewVisualApproved'] for p in images)
          assert len({p.get('sourceUrl') or p['sourcePage'] for p in images})==21
          for p in images:
            loc=pathlib.Path('public'+p['localPath'])
            assert loc.is_file(), p['key']
            assert hashlib.sha256(loc.read_bytes()).hexdigest()==p['webpSHA256']
            with Image.open(loc) as im:
              assert im.format=='WEBP' and im.width<=1280 and im.height<=850
          assert pathlib.Path('public/images/travel/jaipur-premium/source-review-contact-sheet.webp').is_file()
          print('JAIPUR_77_21_REAL_WEBP_CANDIDATES_READY_FOR_VISUAL_QA')
          PY
      - name: Commit optimized WebPs, audit and contact sheet to existing feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/images/travel/jaipur-premium/ data/travel/jaipurMediaCandidates.json data/travel/jaipurWebpOptimization.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(travel): Jaipur 77 21 source-checked WebP photo candidates [skip ci]"
            for attempt in 1 2 3 4; do
              git fetch origin feature/luxury-travel-seo-destinations-20261012
              git rebase origin/feature/luxury-travel-seo-destinations-20261012
              if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then
                echo "JAIPUR_79_CANDIDATES_COMMITTED"
                exit 0
              fi
              sleep 3
            done
            echo "Jaipur asset push failed after retries" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jaipur-77-image-optimization-audit
          path: |
            data/travel/jaipurWebpOptimization.json
            public/images/travel/jaipur-premium/source-review-contact-sheet.webp
          if-no-files-found: ignore
