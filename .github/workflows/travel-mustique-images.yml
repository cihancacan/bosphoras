name: Travel Mustique — import authentic property and island WebP
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: [scripts/download-mustique-images.py, .github/workflows/travel-mustique-images.yml]
permissions:
  contents: write
concurrency:
  group: mustique-images-feature
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/download-mustique-images.py
      - name: Download and WebP-transform official Mustique photographs
        run: python scripts/download-mustique-images.py
      - name: Persist media and audited manifests without a Vercel build
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          [ ! -d public/images/travel/mustique-premium ] || git add public/images/travel/mustique-premium
          git add data/travel/mustiquePremiumImageSources.json data/travel/mustiqueDestinationImageSources.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): Mustique official WebP and source manifests [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mustique-image-sources-and-rights
          path: |
            data/travel/mustiquePremiumImageSources.json
            data/travel/mustiqueDestinationImageSources.json
          if-no-files-found: ignore
