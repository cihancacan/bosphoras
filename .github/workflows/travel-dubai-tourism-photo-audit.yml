name: Travel Dubai — audit official tourism photo candidates
on:
  push:
    branches:
      - feature/luxury-travel-seo-destinations-20261012
    paths:
      - scripts/audit-dubai-visitdubai-photos.py
      - .github/workflows/travel-dubai-tourism-photo-audit.yml
permissions:
  contents: write
jobs:
  visit-dubai-photo-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Inspect original official tourism image references
        run: python scripts/audit-dubai-visitdubai-photos.py
      - name: Save reviewable candidate audit on feature branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f data/travel/dubaiVisitDubaiCandidateAudit.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/travel/dubaiVisitDubaiCandidateAudit.json
            if ! git diff --cached --quiet; then
              git commit -m 'chore(travel): record official Dubai tourism image candidates [skip ci]'
              git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
              git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
            fi
          fi
