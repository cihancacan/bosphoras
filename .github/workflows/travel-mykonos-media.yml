name: Travel Mykonos — collect candidate originals (GitHub only)
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/collect-mykonos-media.py
      - .github/workflows/travel-mykonos-media.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: travel-mykonos-photos
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/collect-mykonos-media.py
      - run: python -u scripts/collect-mykonos-media.py
      - name: Confirm no false photo approval or publication
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/travel/mykonosMediaCandidates.json',encoding='utf8'))
          assert len(d['hotels'])==12 and len(d['destinationScenes'])==9
          assert not d['visuallyVerified'] and not d['approvedForCommercialPublication']
          assert not any(x['visuallyVerified'] or x['commercialRightsCleared'] for x in d['hotels']+d['destinationScenes'])
          print('All Mykonos image candidates remain blocked.')
          PY
      - name: Commit candidates to GitHub only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- public/images/travel/mykonos-premium data/travel/mykonosMediaCandidates.json docs/travel-mykonos-download-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): Mykonos source-linked image candidates [skip ci]'
            for attempt in 1 2 3 4 5; do
              git fetch origin feature/luxury-travel-seo-destinations-20261012
              git rebase origin/feature/luxury-travel-seo-destinations-20261012
              if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then
                echo "Mykonos originals committed successfully"
                exit 0
              fi
              echo "Concurrent branch update, retry ${attempt}/5"
              sleep 2
            done
            echo 'Unable to persist Mykonos originals without racing branch updates' >&2
            exit 1
          fi
