name: Travel Cap d'Antibes — collect authentic source photo candidates (no Vercel)
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - 'scripts/collect-cap-dantibes-media.py'
      - '.github/workflows/travel-cap-dantibes-media.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cap-dantibes-photo-source-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/collect-monaco-media.py scripts/collect-cap-dantibes-media.py
      - run: python -u scripts/collect-cap-dantibes-media.py
      - name: Prove collection never self-approves photographs
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          m=json.loads(Path('data/travel/capDAntibesMediaCandidates.json').read_text())
          assert m['destination']=='cap-dantibes' and len(m['hotels'])==12 and len(m['destinationScenes'])==9
          assert not m['visuallyVerified'] and not m['approvedForCommercialPublication']
          for x in m['hotels']+m['destinationScenes']:
              # Already reviewed photographs must remain approved, while any
              # freshly downloaded replacement MUST stay unapproved.
              if x.get('visuallyVerified'):
                  assert x.get('commercialRightsCleared') is True and not x.get('visualQaWarning'),x['key']
                  assert x.get('frCaption') and x.get('enCaption'),x['key']
              else:
                  assert x.get('commercialRightsCleared') is False,x['key']
                  assert x.get('visualQaWarning'),x['key']
              if x['status']=='candidate_needs_visual_review':
                  assert x['localPath'].startswith('/images/travel/cap-dantibes-premium/')
                  assert re.fullmatch('[a-f0-9]{64}',x['sha256'])
                  assert x.get('credit') and x.get('sourcePage')
          print('SAFE_CANDIDATES:',sum(x.get('localPath') is not None for x in m['hotels']+m['destinationScenes']))
          PY
      - name: Persist authentic WebP candidates to feature branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/travel/capDAntibesMediaCandidates.json public/images/travel/cap-dantibes-premium || true
          if ! git diff --cached --quiet; then
            git commit -m "assets(travel): source-backed Cap d'Antibes photo candidates for visual QA [skip ci]"
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
