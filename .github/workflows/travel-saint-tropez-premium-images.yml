name: Travel Saint-Tropez — curated hotel image importer
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths:
      - scripts/download-saint-tropez-premium-hotel-photos.py
      - .github/workflows/travel-saint-tropez-premium-images.yml
permissions:
  contents: write
concurrency:
  group: travel-saint-tropez-hotel-media
  cancel-in-progress: false
jobs:
  import-hotel-media:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'Pillow>=10,<12'
      - name: Download only identified Saint-Tropez hotel photos
        run: python scripts/download-saint-tropez-premium-hotel-photos.py
      - name: Save photo assets and source audit to feature branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f data/travel/saintTropezPremiumImageSources.json ]; then git add data/travel/saintTropezPremiumImageSources.json; fi
          if [ -d public/images/travel/saint-tropez-premium ]; then git add public/images/travel/saint-tropez-premium; fi
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): import property-specific Saint-Tropez photos and provenance [skip ci]'
            git pull --rebase origin feature/luxury-travel-seo-destinations-20261012
            git push origin HEAD:feature/luxury-travel-seo-destinations-20261012
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saint-tropez-hotel-photo-source-ledger
          path: data/travel/saintTropezPremiumImageSources.json
          if-no-files-found: ignore
