name: Travel Chiang Mai — source images (no Vercel)
on:
  push:
    branches: [feature/luxury-travel-seo-destinations-20261012]
    paths: ['scripts/collect-chiang-mai-media.py','.github/workflows/travel-chiang-mai-media.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: chiang-mai-media-source
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - run: python -m py_compile scripts/collect-chiang-mai-media.py
      - run: python -u scripts/collect-chiang-mai-media.py
      - name: Commit candidate images and provenance without public release
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/travel/chiangMaiMediaCandidates.json docs/travel-chiang-mai-acquisition-report.json docs/travel-chiang-mai-contact-sheet.jpg
          if [ -d public/images/travel/chiang-mai-premium ]; then
            git add -A -- public/images/travel/chiang-mai-premium
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'assets(travel): Chiang Mai original photo candidates, licenses and contact sheet [skip ci]'
            for i in 1 2 3 4 5; do
              git fetch origin feature/luxury-travel-seo-destinations-20261012
              git rebase origin/feature/luxury-travel-seo-destinations-20261012
              if git push origin HEAD:feature/luxury-travel-seo-destinations-20261012; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
